[package]
name = "mohlauncher"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "MoHAA Launcher for Windows and Linux: starts MoHAA Reloaded's game for Allied Assault, Spearhead or Breakthrough"
license = "GPL-3.0-or-later"
publish = false
# not build.rs: the port branches' .gitignore ignores build*
build = "compile-ui.rs"

[dependencies]
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
# updates (src/update.rs): the release over HTTPS with rustls, its own crypto (ring, also the downloads' SHA-256) and
# Mozilla's root certificates built in, so no OpenSSL or system TLS library; the Linux tarball and the Windows zip
# (both readers on both systems, so that `cargo test` checks each)
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
ring = "0.17"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "~1.18"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# small: the window is light work for any build
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
