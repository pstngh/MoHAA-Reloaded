##########################
#
# Linux
# Ubuntu 22.04
#
# Using this version instead of 24.04 to use a lower GLIBC version (2.34).
# Built on an x86-64 runner, not cross-compiled on ARM: the SDL 3 the package
# ships needs the target's X11 and Wayland development files for its video
# drivers (Ubuntu 22.04 and 24.04 have no SDL 3 of their own).
##########################
name: "Linux Builds"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'unstable' }}

jobs:
  build:
    strategy:
      matrix:
        architecture: [
          {name: 'amd64',   os: "ubuntu-22.04", package: 'x86-64-linux-gnu',      triple: 'x86_64-linux-gnu',      arch_option: 'linux-x86_64'}
        ]

    name: "Building for platform linux-${{matrix.architecture.name}}"
    runs-on: ${{ matrix.architecture.os }}
    environment: ${{ inputs.environment }}
    env:
        wolfssl-version: 'v5.7.6-stable'
        curl-version: '8_12_1'
        sdl3-branch: 'release-3.4.18'
        vulkan-headers-version: 'v1.4.341'

    steps:
    ###
    # Packages
    ###

    # The runner's package lists can be older than the archive (a 404 then
    # installs nothing, and the action below still succeeds)
    - name: Update the package lists
      run: sudo apt-get update

    - uses: awalsh128/cache-apt-pkgs-action@latest
      name: Install required packages
      with:
        packages: flex bison ninja-build cmake clang libpulse-dev portaudio19-dev libasound2-dev libjack-dev libpipewire-0.3-dev qtbase5-dev libdbus-1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev libdrm-dev libgbm-dev libudev-dev libfontconfig1-dev
        version: "${{ runner.os }}-${{ runner.arch }}-v3"

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "HOST_TRIPLE=$(gcc -dumpmachine)" >> $GITHUB_ENV

    - uses: awalsh128/cache-apt-pkgs-action@latest
      name: Install required cross-platform packages (${{ matrix.architecture.package }})
      if: env.HOST_TRIPLE != matrix.architecture.triple
      with:
        packages: gcc-12-${{ matrix.architecture.package }} g++-12-${{ matrix.architecture.package }}
        version: "${{ runner.os }}-${{ runner.arch }}-v1"

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CFLAGS='--target=${{ matrix.architecture.triple }}'" >> $GITHUB_ENV
        echo "CXXFLAGS='--target=${{ matrix.architecture.triple }}'" >> $GITHUB_ENV

    ###
    # SDL
    ###

    # Cache SDL
    - name: Cache SDL3
      id: cache-sdl3
      uses: actions/cache@v4
      with:
        path: 'thirdparties/SDL3/install'
        key: ${{ runner.os }}-${{ matrix.architecture.name }}-sdl3-${{ env.sdl3-branch }}-v1

    # SDL3 setup
    - name: Checkout SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'libsdl-org/SDL'
        path: 'thirdparties/SDL3'
        ref: '${{ env.sdl3-branch }}'

    - name: Configure and install SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/SDL3
      run: |
        cmake -B ./build \
        -DCMAKE_BUILD_TYPE=Release \
        -DSDL_TESTS=OFF \
        -DSDL_EXAMPLES=OFF \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/SDL3/install'
        # SDL leaves out a video driver whose development files are missing:
        # the package's SDL must open windows under X11 and Wayland
        for driver in X11 WAYLAND; do
          grep -q "^#define SDL_VIDEO_DRIVER_$driver 1" ./build/include-config-release/build_config/SDL_build_config.h || { echo "SDL3 without its $driver video driver"; exit 1; }
        done
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release

    ###
    # Vulkan headers (renderer_vulkan only uses the headers: Vulkan is
    # loaded at runtime through SDL)
    ###
    - name: Cache Vulkan-Headers
      id: cache-vulkan-headers
      uses: actions/cache@v4
      with:
        path: 'thirdparties/Vulkan-Headers/install'
        key: ${{ runner.os }}-vulkan-headers-${{ env.vulkan-headers-version }}-v1

    - name: Checkout Vulkan-Headers
      if: steps.cache-vulkan-headers.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'KhronosGroup/Vulkan-Headers'
        path: 'thirdparties/Vulkan-Headers'
        ref: '${{ env.vulkan-headers-version }}'

    - name: Configure and install Vulkan-Headers
      if: steps.cache-vulkan-headers.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/Vulkan-Headers
      run: |
        cmake -B ./build \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/Vulkan-Headers/install'
        cmake --install ./build

    ###
    # WolfSSL
    ###
    - name: Cache WolfSSL
      id: cache-wolfssl
      uses: actions/cache@v4
      with:
        path: 'thirdparties/wolfssl/install'
        key: ${{ runner.os }}-${{ matrix.architecture.name }}-wolfssl-${{ env.wolfssl-version }}-v1

    # WolfSSL setup
    - name: Checkout WolfSSL
      if: steps.cache-wolfssl.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'wolfssl/wolfssl'
        path: 'thirdparties/wolfssl'
        ref: '${{ env.wolfssl-version }}'

    # WolfSSL build
    - name: Configure and install wolfssl
      if: steps.cache-wolfssl.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/wolfssl
      run: |
        cmake -B ./build \
            -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/wolfssl/install' \
            -DCMAKE_C_FLAGS="$CFLAGS -fPIC" \
            -DCMAKE_CXX_FLAGS="$CFLAGS -fPIC" \
            -DBUILD_SHARED_LIBS=OFF -DWOLFSSL_OPENSSLEXTRA=ON -DWOLFSSL_ASM=OFF -DWOLFSSL_EXAMPLES=OFF -DWOLFSSL_CURL=ON
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release

    ###
    # cURL
    ###
    - name: Cache cURL
      id: cache-curl
      uses: actions/cache@v4
      with:
        path: 'thirdparties/curl/install'
        key: ${{ runner.os }}-${{ matrix.architecture.name }}-curl-${{ env.curl-version }}-v1

    # cURL setup
    - name: Checkout cURL
      if: steps.cache-curl.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'curl/curl'
        path: 'thirdparties/curl'
        ref: 'curl-${{ env.curl-version }}'

    # cURL build
    - name: Configure and install curl
      if: steps.cache-curl.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/curl
      run: |
        cmake -B ./build \
            -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/curl/install' \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_USE_WOLFSSL=ON \
            -DCURL_ZLIB="" \
            -DCURL_BROTLI="" \
            -DCURL_ZSTD="" \
            -DCMAKE_SHARED_LINKER_FLAGS="-lm" \
            -DWolfSSL_ROOT='${{github.workspace}}/thirdparties/wolfssl/install'
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release

    ###
    # Project
    ###

    - uses: actions/checkout@v4
      with:
        path: 'source'

    - name: CMake Settings
      run: |
        echo "CMAKE_PARAM=--log-level=VERBOSE \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/install' \
        -DUSE_INTERNAL_SDL=OFF \
        -DSDL3_DIR='${{github.workspace}}/thirdparties/SDL3/install/lib/cmake/SDL3' \
        -DCURL_ROOT='${{github.workspace}}/thirdparties/curl/install' \
        -DBUILD_RENDERER_VULKAN=ON \
        -DVulkanHeaders_DIR='${{github.workspace}}/thirdparties/Vulkan-Headers/install/share/cmake/VulkanHeaders' \
        -DGIT_REVISION_BUILD_NUMBER=${{ github.run_number }} \
        -DPRODUCT_VERSION_STAGE='${{ env.RELEASE_STAGE }}'" >> $GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build ${{ env.CMAKE_PARAM }} ./source

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Install
      working-directory: ${{github.workspace}}
      # Install to the directory defined in CMAKE_INSTALL_PREFIX
      run: |
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
        # Copy libraries
        mkdir ${{github.workspace}}/package
        cp -l ${{github.workspace}}/thirdparties/SDL3/install/lib/libSDL3.so.0 '${{github.workspace}}/package/'
        cp -l ${{github.workspace}}/thirdparties/curl/install/lib*/libcurl.so.4 '${{github.workspace}}/package/'
        if [ -d ${{github.workspace}}/install/bin ]; then cp -r ${{github.workspace}}/install/bin/openmohaa/. '${{github.workspace}}/package'; fi
        if [ -d ${{github.workspace}}/install/lib ]; then cp -r ${{github.workspace}}/install/lib/openmohaa/. '${{github.workspace}}/package'; fi

    ###
    # MoHAA Launcher (launcher/desktop: Rust and Slint), beside the game
    ###
    - name: Cache the launcher's build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ${{github.workspace}}/source/launcher/desktop/target
        key: ${{ runner.os }}-${{ matrix.architecture.name }}-launcher-${{ hashFiles('source/launcher/desktop/Cargo.lock') }}

    - name: Build the launcher
      working-directory: ${{github.workspace}}/source/launcher/desktop
      run: |
        # the game's clang settings aren't the launcher's
        unset CC CXX CFLAGS CXXFLAGS
        cargo test --locked
        cargo build --release --locked
        cp target/release/mohlauncher '${{github.workspace}}/package/'

    ###
    # Artifacts
    ###

    - uses: actions/upload-artifact@v4
      with:
        retention-days: 3
        name: out-linux-${{matrix.architecture.name}}
        if-no-files-found: error
        compression-level: 9
        path:
          ${{github.workspace}}/package