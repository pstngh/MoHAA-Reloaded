##########################
#
# The Metal port: macOS 26 on Apple Silicon
#
# Builds with README.md's commands as written (Xcode's Metal Toolchain component, Homebrew's CMake, Ninja and Bison),
# checks the install, and uploads the ad-hoc-signed release zip (port/release.sh) as a workflow artifact. No release,
# no tag, no secrets.
##########################
name: "macOS Metal build"

on:
  push:
    branches: [metal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build, check and package (macOS 26, arm64)"
    runs-on: macos-26
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v5

    - name: Xcode and SDK
      run: |
        xcodebuild -version
        xcrun --sdk macosx --show-sdk-version
        uname -m
        sw_vers

    # README.md "Building": the Metal shader compiler is a separate Xcode component since Xcode 26
    - name: Install Xcode's Metal Toolchain component
      run: |
        xcodebuild -downloadComponent MetalToolchain
        xcrun -f metallib
        xcrun metal --version

    - name: Install CMake, Ninja and Bison
      env:
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: brew install cmake ninja bison

    # README.md's three commands, as written (no -DMETAL_TOOLCHAIN_BIN: CMake finds the compiler by itself)
    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install"

    - name: Build
      run: cmake --build build

    - name: Install
      run: cmake --install build

    - name: Check the install
      run: |
        set -euo pipefail
        D=install/lib/openmohaa
        # The prefix holds exactly the app (no dedicated server), with the game modules inside it
        diff <(cd install && find . -mindepth 1 -not -path './lib/openmohaa/openmohaa.app/*' | sort) \
             <(printf '%s\n' ./lib ./lib/openmohaa ./lib/openmohaa/openmohaa.app)
        diff <(ls "$D/openmohaa.app/Contents/MacOS") <(printf '%s\n' cgame.dylib game.dylib openmohaa)
        # The whole bundle: no openal-soft since Phase 9g (no Frameworks, no license folder in Resources)
        diff <(cd "$D/openmohaa.app" && find . -type f | sort) \
             <(printf '%s\n' ./Contents/Info.plist ./Contents/MacOS/cgame.dylib ./Contents/MacOS/game.dylib \
                 ./Contents/MacOS/openmohaa ./Contents/Resources/openmohaa-metal.icns \
                 ./Contents/_CodeSignature/CodeResources | sort)
        codesign --verify --deep --strict --verbose=2 "$D/openmohaa.app"
        codesign -dv "$D/openmohaa.app" 2>&1 | grep -E '^(Identifier|Format|Signature)='
        /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' -c 'Print CFBundleShortVersionString' "$D/openmohaa.app/Contents/Info.plist"
        # arm64 only, and nothing loaded from outside the system or the app (no Homebrew paths)
        for f in "$D"/openmohaa.app/Contents/MacOS/*; do
          [ "$(lipo -archs "$f")" = arm64 ]
          if otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -vE '^(/System/|/usr/lib/|@rpath/)'; then
            echo "$f loads a library from outside the system or the app" >&2; exit 1
          fi
          # No OpenAL (Phase 9g): the native sound engine is the only one
          if nm "$f" | grep -E ' [UTt] _alc?[A-Z]'; then
            echo "$f imports or defines al*/alc* symbols" >&2; exit 1
          fi
        done

    - name: Test MoHAA Launcher's logic
      run: swift test --package-path launcher/macos

    - name: Package
      run: |
        port/release.sh "$PWD/install/lib/openmohaa" "$PWD/dist"
        { echo '### Release zip (workflow artifact, not a release)'; echo; echo '```'; cat dist/*.zip.sha256; echo '```'; \
          echo; echo "Commit $GITHUB_SHA"; } >> "$GITHUB_STEP_SUMMARY"

    # archive: false uploads the zip itself (one file), not wrapped in another zip
    - name: Upload the release zip
      uses: actions/upload-artifact@v7
      with:
        path: dist/openmohaa-metal-*-macos-arm64.zip
        archive: false
        if-no-files-found: error
        retention-days: 30
